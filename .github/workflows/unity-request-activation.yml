# Request Unity activation file — one-time (per game-ci image version) helper.
#
# Generates a Unity manual activation request file (.alf) from INSIDE the same
# game-ci container image that the verify workflow uses, so the machine identity
# Unity sees while generating the request matches the identity it will see on
# every verify run (the verify workflow pins a stable machine ID — see the
# license comment in unity-verify.yml).
#
# Flow:
#   1. Run this workflow (Actions tab -> "Request Unity activation file" ->
#      Run workflow) and wait for it to finish.
#   2. Download the "unity-activation-file" artifact (contains Unity_v<ver>.alf).
#   3. Upload the .alf at https://license.unity3d.com/manual (sign in with the
#      Unity account that owns the personal license) and download the returned
#      .ulf license file.
#   4. Paste the FULL .ulf contents into the repo's UNITY_LICENSE secret
#      (Settings -> Secrets and variables -> Actions -> UNITY_LICENSE).
#      Never paste license contents into chat.
#   5. Re-run "Unity verify" — Unity should now accept the license and the
#      real compile/playmode verification can proceed.
#
# Why this exists: a .ulf generated by Unity Hub on a dev PC is bound to that
# PC's machine ID and CI rejects it (verified 2026-10-01: 0 entitlements, exit
# code 5). The .ulf must be bound to the container's stable machine identity,
# which is what this workflow captures.
#
# If the game-ci image ever changes its baked-in machine ID (e.g. a new rolling
# image version for the same Unity release), repeat this flow to rebind.
name: Request Unity activation file

on:
  workflow_dispatch:

jobs:
  request:
    name: Generate .alf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate manual activation file
        id: alf
        run: |
          set -e
          VER=$(grep -oP 'm_EditorVersion:\s*\K[0-9]+\.[0-9]+\.[0-9]+[a-z][0-9]+' ProjectSettings/ProjectVersion.txt)
          IMAGE="unityci/editor:ubuntu-${VER}-base-3"
          echo "Unity version: $VER"
          echo "Image: $IMAGE"
          # Bypass the image entrypoint (--entrypoint) so no activation or
          # machine-ID logic runs; we only need the editor binary. The
          # container then sees the image's default (stable) machine ID —
          # exactly what the verify workflow sees after its fix.
          docker run --rm \
            --entrypoint /bin/bash \
            --workdir /github/workspace \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            "$IMAGE" \
            -c 'which unity-editor && unity-editor -batchmode -nographics -quit -logfile -createManualActivationFile'
          ls -la Unity_v*.alf
          echo "alf=$(ls Unity_v*.alf | head -1)" >> $GITHUB_OUTPUT

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.alf.outputs.alf }}
          if-no-files-found: error
