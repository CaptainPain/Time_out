# Unity verify — TIME OUT's autonomous build/test/fix loop.
#
# On every push that touches the game (or manually via workflow_dispatch):
#   1. Spins up Unity 6000.6 in batch mode (GameCI).
#   2. Compiles the project for real — C# errors fail the run.
#   3. Runs TimeOutCI.Verify (Assets/Editor/TimeOutCI.cs): boots the game,
#      taps through the menu, drives every cutscene beat of the story opening,
#      rides a few seconds, and asserts the locked rules:
#        - every text box <= 1/4 of screen height
#        - text never overflows its label
#        - camera never drops its subject (frustum check)
#        - zero Unity errors/exceptions
#   4. Uploads screenshots + results.json as the `verify-output` artifact,
#      which Spike downloads, inspects, and iterates on — no human needed.
#
# License (rewritten 2026-10-02): GameCI v6 personal-seat activation.
#
# History — the .ulf pre-install approach died for good on 2026-10-01.
# Two verified root causes:
#   1. A Unity Hub .ulf is bound to the dev PC's machine ID; the CI container
#      has a different one, so Unity resolved zero entitlements and exited 5
#      (run 14, 2026-10-01).
#   2. The manual-activation escape hatch (.alf -> license.unity3d.com/manual
#      -> .ulf) is CLOSED: Unity withdrew manual activation for Personal
#      licenses in August 2023. The page now demands a serial number, which
#      free Personal licenses don't have. There is no .ulf to be had on a
#      free account — do not send anyone down that path again.
#
# Current mechanism (game-ci/unity-builder@v6, thin wrapper around game-ci/cli):
# the container acquires a Personal seat ONLINE straight from Unity's licensing
# service (Unity.Licensing.Client --activate-all --include-personal) using the
# UNITY_EMAIL / UNITY_PASSWORD repo secrets, holds it for the run, and returns
# it afterwards (return_license.sh runs on an EXIT trap, so even a crashed run
# gives the seat back). No .ulf file is involved anywhere, so machine-ID
# binding is a non-issue: activation happens fresh inside the same container
# that runs the editor.
#
# Secrets required (Settings -> Secrets and variables -> Actions):
#   UNITY_EMAIL / UNITY_PASSWORD — a Unity ID login with email + password.
#   NOT a Google/Apple/Facebook social login (those have no password), and the
#   account must have 2FA disabled: headless activation cannot answer a 2FA
#   challenge. A leaked seat (killed job) is released at https://id.unity.com.
#
# Docs: https://game.ci/docs/github/activation
name: Unity verify (build/test/fix loop)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-verify.yml'
  workflow_dispatch:

concurrency:
  group: unity-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile + playmode verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run Unity verification
        uses: game-ci/unity-builder@v6
        env:
          # Personal-seat activation (see header comment). The CLI resolves the
          # `personal` strategy from exactly these two and nothing else — do
          # NOT also set UNITY_SERIAL or UNITY_LICENSE here, or a different
          # strategy wins and activation breaks.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: TimeOutCI.Verify
          # The verify method drives playmode asynchronously and exits itself.
          manualExit: true
          # Screenshots need a real graphics device (no -nographics).
          enableGpu: true
          versioning: None

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output/
          if-no-files-found: warn
