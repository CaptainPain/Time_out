# Unity verify — TIME OUT's autonomous build/test/fix loop.
#
# On every push that touches the game (or manually via workflow_dispatch):
#   1. Spins up Unity 6000.6 in batch mode (GameCI).
#   2. Compiles the project for real — C# errors fail the run.
#   3. Runs TimeOutCI.Verify (Assets/Editor/TimeOutCI.cs): boots the game,
#      taps through the menu, drives every cutscene beat of the story opening,
#      rides a few seconds, and asserts the locked rules:
#        - every text box <= 1/4 of screen height
#        - text never overflows its label
#        - camera never drops its subject (frustum check)
#        - zero Unity errors/exceptions
#   4. Uploads screenshots + results.json as the `verify-output` artifact,
#      which Spike downloads, inspects, and iterates on — no human needed.
#
# License: the .ulf is pre-installed by the "Install Unity license" step and the
# builder runs with skipActivation: true, so GameCI never activates anything.
#
# CRITICAL (verified 2026-10-01 against game-ci/unity-builder@v4 source, run
# 36919330154): GameCI extracts the serial from UNITY_LICENSE
# (getSerialFromLicenseFile) and passes it into the container as UNITY_SERIAL.
# The container entrypoint randomizes /etc/machine-id whenever UNITY_SERIAL
# starts with "F" (every personal-license serial does). A randomized machine ID
# makes Unity's licensing client report a different Machine Id on every run, so
# a .ulf bound to ANY real machine resolves zero entitlements
# ("Found 0 entitlement groups and 0 free entitlements", exit code 5) — exactly
# what run 14 hit with a Hub-generated .ulf (2533 bytes, correctly installed).
#
# Fix: pass UNITY_SERIAL=<placeholder> (any value NOT starting with "F") so
# GameCI skips the serial extraction and the entrypoint leaves the image's
# baked-in machine ID alone. The placeholder is never used for activation
# (skipActivation is true, so activate.sh never runs) — the real serial stays
# inside the .ulf where Unity reads it.
#
# The .ulf in the UNITY_LICENSE secret MUST be bound to the container's stable
# machine identity. Generate it with the "Request Unity activation file"
# workflow (manual .alf -> https://license.unity3d.com/manual -> .ulf), NOT via
# Unity Hub on a dev PC: a Hub .ulf is bound to the PC's machine ID and CI will
# reject it. If the game-ci image ever changes its baked-in machine ID (new
# rolling image version), repeat the activation flow to rebind.
# Docs (describe the old flow): https://game.ci/docs/github/activation
name: Unity verify (build/test/fix loop)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-verify.yml'
  workflow_dispatch:

concurrency:
  group: unity-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile + playmode verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Install Unity license
        env:
          UNITY_LICENSE_CONTENT: ${{ secrets.UNITY_LICENSE }}
        run: |
          LICENSE_DIR="$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity"
          mkdir -p "$LICENSE_DIR"
          printf '%s' "$UNITY_LICENSE_CONTENT" | tr -d '\r' > "$LICENSE_DIR/Unity_lic.ulf"
          BYTES=$(wc -c < "$LICENSE_DIR/Unity_lic.ulf")
          echo "License file bytes: $BYTES"
          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::UNITY_LICENSE secret is only $BYTES bytes - expected a multi-KB .ulf file. Re-paste the full contents of Unity_lic.ulf into the UNITY_LICENSE repo secret."
            exit 1
          fi
          ls -la "$LICENSE_DIR"

      - name: Run Unity verification
        uses: game-ci/unity-builder@v4
        env:
          # The pre-installed .ulf above; kept so the action's node-side license
          # presence check passes. GameCI will NOT extract a serial from it
          # because UNITY_SERIAL below is set (see header comment).
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          # Placeholder, NOT a real serial. Stops GameCI from extracting the
          # F-series serial out of UNITY_LICENSE, which would make the container
          # entrypoint randomize /etc/machine-id and invalidate the .ulf.
          # Must not start with "F". Never used for activation (skipActivation).
          UNITY_SERIAL: preinstalled-personal-ulf
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: TimeOutCI.Verify
          # The verify method drives playmode asynchronously and exits itself.
          manualExit: true
          # Screenshots need a real graphics device (no -nographics).
          enableGpu: true
          versioning: None
          # GameCI activation is bypassed entirely; the .ulf is pre-installed.
          skipActivation: true

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output/
          if-no-files-found: warn
