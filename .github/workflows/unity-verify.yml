# Unity verify — TIME OUT's autonomous build/test/fix loop.
#
# On every push that touches the game (or manually via workflow_dispatch):
#   1. Spins up Unity 6000.6 in batch mode (GameCI).
#   2. Compiles the project for real — C# errors fail the run.
#   3. Runs TimeOutCI.Verify (Assets/Editor/TimeOutCI.cs): boots the game,
#      taps through the menu, drives every cutscene beat of the story opening,
#      rides a few seconds, and asserts the locked rules:
#        - every text box <= 1/4 of screen height
#        - text never overflows its label
#        - camera never drops its subject (frustum check)
#        - zero Unity errors/exceptions
#   4. Uploads screenshots + results.json as the `verify-output` artifact,
#      which Spike downloads, inspects, and iterates on — no human needed.
#
# License: game-ci/unity-builder@v4's personal-license path is broken for this .ulf.
# Verified 2026-09-17 against the v4 source (dist/index.js): the node side reads
# UNITY_LICENSE and tries to extract a serial from the <DeveloperData Value="..."/>
# element (getSerialFromLicenseFile). For our .ulf that extraction silently yields an
# empty serial, so the container got no UNITY_SERIAL and activate.sh died with
# "strategy could not be determined". The .ulf itself is fine — a .ulf IS the activated
# license, and the Unity editor reads it directly from the standard Linux location.
# So we bypass GameCI activation entirely:
#   1. The "Install Unity license" step writes the UNITY_LICENSE secret (your
#      Unity_lic.ulf contents, CR-stripped) to the host path the builder mounts as
#      /root, i.e. /root/.local/share/unity3d/Unity/Unity_lic.ulf in the container.
#   2. The builder still gets UNITY_LICENSE in env so the node-side "Missing Unity
#      License File" check passes, but runs with skipActivation: true, so activate.sh
#      never executes and the empty extracted serial is never used.
# No email/password is needed anywhere. If Unity ever rejects the license (e.g. you
# regenerated it), re-paste C:\ProgramData\Unity\Unity_lic.ulf into the UNITY_LICENSE
# repo secret and re-run. Docs (describe the old flow): https://game.ci/docs/github/activation
name: Unity verify (build/test/fix loop)

on:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-verify.yml'
  workflow_dispatch:

concurrency:
  group: unity-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Compile + playmode verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Install Unity license
        env:
          UNITY_LICENSE_CONTENT: ${{ secrets.UNITY_LICENSE }}
        run: |
          LICENSE_DIR="$RUNNER_TEMP/_github_home/.local/share/unity3d/Unity"
          mkdir -p "$LICENSE_DIR"
          printf '%s' "$UNITY_LICENSE_CONTENT" | tr -d '\r' > "$LICENSE_DIR/Unity_lic.ulf"
          BYTES=$(wc -c < "$LICENSE_DIR/Unity_lic.ulf")
          echo "License file bytes: $BYTES"
          if [ "$BYTES" -lt 1000 ]; then
            echo "::error::UNITY_LICENSE secret is only $BYTES bytes - expected a multi-KB .ulf file. Re-paste the full contents of Unity_lic.ulf into the UNITY_LICENSE repo secret."
            exit 1
          fi
          ls -la "$LICENSE_DIR"

      - name: Run Unity verification
        uses: game-ci/unity-builder@v4
        env:
          # Satisfies the action's node-side license presence check; the serial it tries
          # to extract from this is unused because skipActivation is true below.
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          targetPlatform: StandaloneLinux64
          buildMethod: TimeOutCI.Verify
          # The verify method drives playmode asynchronously and exits itself.
          manualExit: true
          # Screenshots need a real graphics device (no -nographics).
          enableGpu: true
          versioning: None
          # GameCI v4 cannot activate personal licenses; the .ulf is pre-installed above.
          skipActivation: true

      - name: Upload verification output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-output
          path: verify-output/
          if-no-files-found: warn
